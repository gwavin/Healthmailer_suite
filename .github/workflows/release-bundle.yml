name: Release bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing or new release tag, for example v0.1.0. Leave blank to upload a workflow artifact only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build release bundle
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag_name }}" -ne "") {
            $version = "${{ inputs.tag_name }}"
          }
          if ($version -eq "" -or $version -eq "main") {
            $version = "workflow-${{ github.run_number }}"
          }
          powershell -ExecutionPolicy Bypass -File .\tools\New-PrintRxerSuiteReleaseBundle.ps1 -Version $version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintRxerSuite-release-bundle
          path: |
            dist/PrintRxerV3-*.zip
            dist/HealthMailer-*.zip

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag_name }}" -ne "") {
            $tag = "${{ inputs.tag_name }}"
          }

          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist/PrintRxerV3-*.zip dist/HealthMailer-*.zip --title "PrintRxer Suite $tag" --generate-notes
          } else {
            gh release upload $tag dist/PrintRxerV3-*.zip dist/HealthMailer-*.zip --clobber
          }
